<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Coral Background -->
    <clipPath id="eyeClip">
      <path d="M 18,338 C 90,270 190,195 300,195 C 410,195 510,265 582,286 C 540,296 460,378 320,398 C 180,418 80,380 18,338 Z" />
    </clipPath>
    
    <!-- Iris Gradient -->
    <radialGradient id="irisGradient" cx="44%" cy="50%" r="55%" fx="42%" fy="48%">
      <stop offset="0%" stop-color="#3CD5CB" />
      <stop offset="35%" stop-color="#21A19D" />
      <stop offset="68%" stop-color="#0F6671" />
      <stop offset="92%" stop-color="#053F47" />
      <stop offset="100%" stop-color="#02272D" />
    </radialGradient>

    <!-- Shadow under upper eyelid onto eyeball -->
    <linearGradient id="lidShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Solid Coral Red Background matching user's exact uploaded image -->
  <rect width="600" height="600" fill="#FA6868" />

  <!-- White Eyeball Sclera -->
  <path d="M 18,338 C 90,270 190,195 300,195 C 410,195 510,265 582,286 C 540,296 460,378 320,398 C 180,418 80,380 18,338 Z" fill="#FFFFFF" />

  <!-- Eyeball internal contents clipped to eye shape -->
  <g clip-path="url(#eyeClip)">
    <!-- Soft shadow beneath upper lid -->
    <rect x="0" y="195" width="600" height="50" fill="url(#lidShadow)" />

    <!-- Iris (Big Teal Circle) -->
    <circle cx="282" cy="298" r="108" fill="url(#irisGradient)" stroke="#000000" stroke-width="15" />

    <!-- Center Pupil (Solid Black Circle) -->
    <circle cx="282" cy="300" r="28" fill="#000000" />

    <!-- Top-Left Curved Specular Arc Highlight -->
    <path d="M 212,286 C 205,260 216,230 236,214 C 243,209 253,220 248,226 C 234,238 227,258 231,278 C 233,285 220,293 212,286 Z" fill="#FFFFFF" />

    <!-- Text 'v2u' curved on the upper left of iris -->
    <g transform="rotate(-36 282 298)">
      <text x="210" y="222" font-family="'Montserrat', 'Comic Sans MS', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">v2u</text>
    </g>

    <!-- Sparkle Star (4-point star in lower-left) -->
    <!-- Center of sparkle at approx (208, 334) -->
    <path d="M 208,322 Q 208,334 196,334 Q 208,334 208,346 Q 208,334 220,334 Q 208,334 208,322 Z" fill="#FFFFFF" />
  </g>

  <!-- Outer Black Eye Outline (Smooth bold line matching original art) -->
  <path d="M 18,338 C 90,270 190,195 300,195 C 410,195 510,265 582,286 C 540,296 460,378 320,398 C 180,418 80,380 18,338 Z" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Soft subtle shadow under lower eyelid like original -->
  <path d="M 220,398 C 270,412 340,408 380,392" fill="none" stroke="#E25454" stroke-width="8" stroke-linecap="round" opacity="0.4" />
</svg>